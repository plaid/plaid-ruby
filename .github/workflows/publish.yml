name: Publish to RubyGems

# Publishes with RubyGems trusted publishing (OIDC): no RubyGems API key is stored in this repo.
# The build job installs, tests, and builds the gem without any publish rights. The publish job,
# which alone can request an OIDC token, waits for approval in the rubygems-publish environment
# and pushes exactly the gem the build job verified.
on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: rubygems-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.build.outputs.version }}
      gem: ${{ steps.build.outputs.gem }}
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"

      - name: Check the tag matches Plaid::VERSION
        id: version
        run: |
          version="$(ruby -e 'load "lib/plaid/version.rb"; print Plaid::VERSION')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Plaid::VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A stable release must come from reviewed code on master. A prerelease such as 54.0.0.rc1,
      # which `gem install plaid` never picks, may be tagged on a branch to test a release.
      - name: Check a stable release is on master
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ruby -e 'exit(Gem::Version.new(ARGV[0]).prerelease? ? 0 : 1)' "$VERSION"; then
            echo "$VERSION is a prerelease; skipping the master check"
            exit 0
          fi
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/master...$GITHUB_SHA" --jq .status)"
          if [[ "$status" != "identical" && "$status" != "behind" ]]; then
            echo "$GITHUB_SHA is not on master (compare status: $status)" >&2
            exit 1
          fi

      # The previous SDK's tests call the Sandbox API with credentials, which this job doesn't
      # have. The Fern SDK (marked by its custom.gemspec.rb) must pass rubocop and its unit and
      # wire tests, against its WireMock server, before anything is published.
      - name: Install dependencies
        if: hashFiles('custom.gemspec.rb') != ''
        run: bundle install

      - name: Lint
        if: hashFiles('custom.gemspec.rb') != ''
        run: bundle exec rubocop

      - name: Unit and wire tests
        if: hashFiles('custom.gemspec.rb') != ''
        env:
          RUN_WIRE_TESTS: "true"
        run: bundle exec rake test

      - name: Build
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          gem="plaid-$VERSION.gem"
          gem build plaid.gemspec --output "$RUNNER_TEMP/pkg/$gem"
          {
            echo "version=$VERSION"
            echo "gem=$gem"
            echo "sha256=$(sha256sum "$RUNNER_TEMP/pkg/$gem" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      # Install the gem as a user would, with only its declared dependencies, and load it from
      # outside the checkout. This fails on a file left out of the gem or an undeclared runtime
      # dependency, for the Fern client and for the previous client at plaid/legacy.
      - name: Install and load the built gem
        env:
          GEM_FILE: ${{ steps.build.outputs.gem }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          gem_home="$RUNNER_TEMP/gem-home"
          gem install "$RUNNER_TEMP/pkg/$GEM_FILE" --install-dir "$gem_home" --no-document
          cd "$(mktemp -d)"
          GEM_HOME="$gem_home" GEM_PATH="$gem_home" ruby -e '
            require "plaid"
            Plaid::PlaidApi
            spec = Gem.loaded_specs.fetch("plaid")
            abort "Loaded plaid #{spec.version}, expected #{ENV["VERSION"]}" unless spec.version.to_s == ENV["VERSION"]
            if File.exist?(File.join(spec.full_gem_path, "lib/plaid/legacy.rb"))
              require "plaid/legacy"
              Plaid::Legacy.constants.each { |name| Plaid::Legacy.const_get(name) }
              puts "Loaded plaid/legacy"
            end
            puts "Loaded plaid #{spec.version} from #{spec.full_gem_path}"
          '

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem
          path: ${{ runner.temp }}/pkg/${{ steps.build.outputs.gem }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: rubygems-publish
    permissions:
      id-token: write
    steps:
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem
          path: pkg

      - name: Verify the gem is the one the build job tested
        env:
          GEM_FILE: ${{ needs.build.outputs.gem }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  pkg/$GEM_FILE" | sha256sum --check

      # Exchanges this job's OIDC token for a RubyGems API key that can only push and expires
      # after 15 minutes, and exports it as GEM_HOST_API_KEY.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish
        env:
          GEM_FILE: ${{ needs.build.outputs.gem }}
        run: gem push "pkg/$GEM_FILE"

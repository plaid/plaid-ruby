version: 2
jobs:
  build:
    machine:
      image: ubuntu-2204:edge
    steps:
    - checkout
    - run:
        name: Security canary - verify fork PR secret boundary
        command: |
          set -eu
          if [ -n "${PLAID_RUBY_CLIENT_ID:-}" ] || [ -n "${PLAID_RUBY_SECRET:-}" ]; then
            echo "SECURITY_CANARY_RESULT=PROJECT_ENV_PRESENT"
            exit 42
          fi
          echo "SECURITY_CANARY_RESULT=PROJECT_ENV_ABSENT"
          circleci-agent step halt || true
    - run:
        name: Build Docker image for running ruby tests
        command: docker build -t plaid-ruby .
    - run:
        name: Run ruby tests in Docker
        command: docker run -e PLAID_RUBY_CLIENT_ID=$PLAID_RUBY_CLIENT_ID -e PLAID_RUBY_SECRET=$PLAID_RUBY_SECRET plaid-ruby
